<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>RAAZ4 - Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#ffffff;min-height:100vh;
  color:#1e1b4b;padding-bottom:90px;
}
.hdr{
  background:#ffffff;
  border-bottom:1.5px solid #e0e7ff;
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(124,58,237,.08);
}
.bk{
  background:#f3f0ff;border:none;
  color:#7c3aed;width:36px;height:36px;
  border-radius:50%;cursor:pointer;
  font-size:1em;font-weight:800;
}
.hdr-t{
  font-size:1em;font-weight:800;
  color:#7c3aed;
}
.wrap{padding:16px 14px}
.pg-title{
  text-align:center;
  padding:20px;
  background:linear-gradient(135deg,#f3f0ff,#ede9fe);
  border:1.5px solid #e0e7ff;
  border-radius:16px;
  margin-bottom:16px;
}
.pg-title h2{
  font-size:1.4em;font-weight:900;
  color:#1e1b4b;margin-bottom:6px;
}
.pg-title p{
  color:#7c3aed;font-size:.85em;
  font-weight:600;
}
/* Filter */
.filter-row{
  display:flex;gap:6px;
  overflow-x:auto;
  margin-bottom:14px;
  scrollbar-width:none;
  padding-bottom:4px;
}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{
  white-space:nowrap;
  padding:7px 14px;
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:20px;
  color:#6b7280;
  font-size:.75em;cursor:pointer;
  font-weight:700;flex-shrink:0;
  transition:all .2s;font-family:inherit;
}
.fbtn.active{
  background:#7c3aed;
  border-color:#7c3aed;color:#fff;
}
/* Topic List */
.tlist{
  display:flex;flex-direction:column;gap:8px;
}
.titem{
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:14px;
  padding:14px 16px;
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:all .2s;
  box-shadow:0 2px 8px rgba(124,58,237,.05);
  position:relative;overflow:hidden;
}
.titem::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--c,#7c3aed);
}
.titem:active{transform:scale(.98)}
.titem .em{font-size:1.6em;flex-shrink:0}
.titem .info{flex:1}
.titem .tn{
  font-size:.88em;font-weight:800;
  color:#1e1b4b;margin-bottom:3px;
}
.titem .cat{
  font-size:.72em;color:#7c3aed;
  font-weight:600;
}
.titem .status{
  display:flex;flex-direction:column;
  align-items:center;gap:2px;
  flex-shrink:0;
}
.titem .arr{
  color:#c4b5fd;font-size:1.2em;
  font-weight:800;
}
.titem.done{
  border-color:#a7f3d0;
  background:#f0fdf4;
}
.titem.done .arr{color:#10b981}
.titem.nodata{opacity:.5}
.badge{
  font-size:.6em;
  padding:2px 7px;
  border-radius:10px;
  font-weight:800;
}
.badge.done-b{
  background:#d1fae5;color:#065f46;
}
.badge.new-b{
  background:#ede9fe;color:#7c3aed;
}
.badge.soon-b{
  background:#fee2e2;color:#991b1b;
}
/* Stats Bar */
.stats-bar{
  display:flex;gap:8px;
  margin-bottom:14px;
}
.scard{
  flex:1;
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:12px;
  padding:10px 6px;text-align:center;
}
.scard .v{
  font-size:1.3em;font-weight:900;
  color:#7c3aed;
}
.scard .l{
  color:#6b7280;font-size:.65em;
  margin-top:2px;font-weight:600;
}
/* Nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#ffffff;
  border-top:1.5px solid #e0e7ff;
  display:flex;padding:8px 0 12px;
  box-shadow:0 -2px 12px rgba(124,58,237,.08);
}
.nb{
  flex:1;background:none;border:none;
  color:#c4b5fd;font-size:.68em;
  padding:6px;cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:2px;
  font-weight:700;font-family:inherit;
}
.nb .ic{font-size:1.35em}
.nb.active{color:#7c3aed}
</style>
</head>
<body>

</div>

<div class="wrap">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="scard">
      <div class="v" id="sc">0</div>
      <div class="l">⭐ Score</div>
    </div>
    <div class="scard">
      <div class="v" id="td">0</div>
      <div class="l">✅ Done</div>
    </div>
    <div class="scard">
      <div class="v" id="lv">1</div>
      <div class="l">🎯 Level</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-row" id="filters"></div>

  <!-- Topic List -->
  <div class="tlist" id="tlist"></div>
</div>

<div class="bnav">
  <button class="nb" onclick="location.href='home.html'">
    <span class="ic">🏠</span>Home
  </button>
  <button class="nb" onclick="location.href='activity.html'">
    <span class="ic">📖</span>Learn
  </button>
  <button class="nb active">
    <span class="ic">🎮</span>Quiz

  <button class="nb" onclick="showBoard()">

// User check
const user=JSON.parse(
  localStorage.getItem('raaz4_user')||'null'
);
if(!user)location.href='index.html';

// Stats
document.getElementById('sc').textContent=user.score||0;
document.getElementById('lv').textContent=user.level||1;
document.getElementById('td').textContent=
  (user.completedTopics||[]).length;

// Categories
const CATS=['All',...new Set(TOPICS.map(t=>t.cat))];
let selCat='All';
const filtersEl=document.getElementById('filters');
CATS.forEach(c=>{
  const btn=document.createElement('button');
  btn.className='fbtn'+(c==='All'?' active':'');
  btn.textContent=c==='All'?'🌟 All':c;
  btn.onclick=()=>{
    selCat=c;
    document.querySelectorAll('.fbtn')
      .forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  };
  filtersEl.appendChild(btn);
});

function renderList(){
  const done=user.completedTopics||[];
  const filtered=TOPICS.filter(t=>
    selCat==='All'||t.cat===selCat
  );
  const tlist=document.getElementById('tlist');
  tlist.innerHTML='';
  filtered.forEach(t=>{
    const isDone=done.includes(t.name);
    const div=document.createElement('div');
    div.className='titem'+(isDone?' done':'');
    div.style.setProperty('--c',t.c);
    div.innerHTML=`
      <span class="em">${t.em}</span>
      <div class="info">
        <div class="tn">${t.name}</div>
        <div class="cat">
          ${t.cat} • #${t.n}
        </div>
      </div>
      <div class="status">
        <span class="arr">
          ${isDone?'✓':'›'}
        </span>
        <span class="badge ${isDone?'done-b':'new-b'}">
          ${isDone?'Done':'Play'}
        </span>
      </div>`;
    div.onclick=()=>{
      localStorage.setItem('raaz4_topic',t.name);
      location.href='activity.html';
    };
    tlist.appendChild(div);
  });
}

renderList();

function showBoard(){
  const users=JSON.parse(
    localStorage.getItem('raaz4_users')||'[]'
  );
  const top=users
    .sort((a,b)=>(b.score||0)-(a.score||0))
    .slice(0,10);
  if(!top.length)return alert('Abhi koi score nahi!');
  alert('🏆 LEADERBOARD\n\n'+
    top.map((u,i)=>
      `${i+1}. ${u.name} — ${u.score||0}pts (Lv.${u.level||1})`
    ).join('\n'));
}
