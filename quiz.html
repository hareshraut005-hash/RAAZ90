<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#ffffff;min-height:100vh;
  color:#1e1b4b;padding-bottom:90px;
}
.hdr{
  background:#ffffff;border-bottom:1.5px solid #e0e7ff;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(124,58,237,.08);
}
.bk{
  background:#f3f0ff;border:none;color:#7c3aed;
  width:36px;height:36px;border-radius:50%;
  cursor:pointer;font-size:1em;font-weight:800;
  display:none;
}
.hdr-t{font-size:1em;font-weight:800;color:#7c3aed;flex:1}
.lang-row{
  padding:10px 14px;background:#f8f7ff;
  border-bottom:1.5px solid #e0e7ff;
  display:flex;gap:8px;align-items:center;
}
.lang-row label{color:#6b7280;font-size:.78em;font-weight:700;white-space:nowrap}
.lsel{
  flex:1;padding:8px 10px;background:#ffffff;
  border:1.5px solid #e0e7ff;border-radius:10px;
  color:#1e1b4b;font-size:.83em;outline:none;
  font-weight:600;font-family:inherit;
}

/* Topic List */
#listPage{display:block}
#quizPage{display:none}

.wrap{padding:14px}
.pg-title{
  text-align:center;padding:18px;
  background:linear-gradient(135deg,#f3f0ff,#ede9fe);
  border:1.5px solid #e0e7ff;border-radius:16px;
  margin-bottom:14px;
}
.pg-title h2{font-size:1.3em;font-weight:900;color:#1e1b4b;margin-bottom:4px}
.pg-title p{color:#7c3aed;font-size:.82em;font-weight:600}

.stats-bar{display:flex;gap:8px;margin-bottom:14px}
.scard{
  flex:1;background:#f8f7ff;border:1.5px solid #e0e7ff;
  border-radius:12px;padding:10px 6px;text-align:center;
}
.scard .v{font-size:1.3em;font-weight:900;color:#7c3aed}
.scard .l{color:#6b7280;font-size:.65em;margin-top:2px;font-weight:600}

.filter-row{
  display:flex;gap:6px;overflow-x:auto;
  margin-bottom:14px;scrollbar-width:none;padding-bottom:4px;
}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{
  white-space:nowrap;padding:7px 14px;
  background:#f8f7ff;border:1.5px solid #e0e7ff;
  border-radius:20px;color:#6b7280;font-size:.75em;
  cursor:pointer;font-weight:700;flex-shrink:0;
  transition:all .2s;font-family:inherit;
}
.fbtn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}

.tlist{display:flex;flex-direction:column;gap:8px}
.titem{
  background:#f8f7ff;border:1.5px solid #e0e7ff;
  border-radius:14px;padding:14px 16px;
  cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:all .2s;position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(124,58,237,.05);
}
.titem::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--c,#7c3aed);
}
.titem:active{transform:scale(.98)}
.titem .em{font-size:1.6em;flex-shrink:0}
.titem .info{flex:1}
.titem .tn{font-size:.88em;font-weight:800;color:#1e1b4b;margin-bottom:3px}
.titem .cat{font-size:.72em;color:#7c3aed;font-weight:600}
.titem .arr{color:#c4b5fd;font-size:1.2em;font-weight:800;flex-shrink:0}
.titem.done{border-color:#a7f3d0;background:#f0fdf4}
.titem.done .arr{color:#10b981}
.titem.nodata{opacity:.5;cursor:not-allowed}
.badge{
  font-size:.6em;padding:2px 7px;
  border-radius:10px;font-weight:800;
}
.done-b{background:#d1fae5;color:#065f46}
.play-b{background:#ede9fe;color:#7c3aed}
.soon-b{background:#fee2e2;color:#991b1b}

/* Quiz Section */
.quiz-wrap{padding:14px}
.topic-hdr{
  margin-bottom:14px;border-radius:16px;
  padding:18px 16px;
  background:linear-gradient(135deg,#f3f0ff,#ede9fe);
  border:1.5px solid #e0e7ff;
  display:flex;align-items:center;gap:14px;
}
.topic-hdr .em{font-size:2.5em}
.topic-hdr .title{font-size:1.1em;font-weight:900;color:#1e1b4b;margin-bottom:4px}
.topic-hdr .sub{font-size:.78em;color:#7c3aed;font-weight:600}

.quiz-info{
  display:flex;gap:8px;margin-bottom:14px;
}
.qi-card{
  flex:1;background:#f8f7ff;border:1.5px solid #e0e7ff;
  border-radius:12px;padding:10px 6px;text-align:center;
}
.qi-card .v{font-size:1.2em;font-weight:900;color:#7c3aed}
.qi-card .l{color:#6b7280;font-size:.65em;margin-top:2px;font-weight:600}

.qcard{
  background:#ffffff;border:1.5px solid #e0e7ff;
  border-radius:14px;padding:16px;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(124,58,237,.05);
}
.qnum{
  color:#7c3aed;font-size:.72em;margin-bottom:6px;
  font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:space-between;
}
.qbadge{
  background:#ede9fe;color:#7c3aed;
  padding:2px 8px;border-radius:10px;font-size:.85em;
}
.qtxt{
  font-size:.92em;color:#1e1b4b;line-height:1.6;
  margin-bottom:14px;font-weight:700;
}
.qopts{display:flex;flex-direction:column;gap:8px}
.opt{
  padding:12px 14px;background:#f8f7ff;
  border:1.5px solid #e0e7ff;border-radius:10px;
  color:#374151;font-size:.84em;cursor:pointer;
  text-align:left;transition:all .2s;width:100%;
  font-weight:600;font-family:inherit;
  display:flex;align-items:center;gap:8px;
}
.opt::before{content:'○';color:#c4b5fd;font-size:.9em;flex-shrink:0}
.opt:hover{border-color:#7c3aed;background:#f3f0ff}
.opt.ok{border-color:#10b981;background:#d1fae5;color:#065f46;font-weight:800}
.opt.ok::before{content:'✓';color:#10b981}
.opt.no{border-color:#ef4444;background:#fee2e2;color:#991b1b;font-weight:800}
.opt.no::before{content:'✗';color:#ef4444}
.opt:disabled{cursor:not-allowed;opacity:.8}
.qexp{
  display:none;margin-top:10px;padding:12px 14px;
  background:#faf5ff;border-left:3px solid #7c3aed;
  border-radius:0 10px 10px 0;
  font-size:.8em;color:#374151;line-height:1.7;font-weight:500;
}

/* Progress Bar */
.prog-bar{
  background:#e0e7ff;border-radius:10px;
  height:8px;margin-bottom:14px;overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:10px;
  background:linear-gradient(90deg,#7c3aed,#6366f1);
  transition:width .3s;
}

/* Result */
.qresult{
  display:none;text-align:center;padding:28px 20px;
  background:linear-gradient(135deg,#f3f0ff,#ede9fe);
  border:1.5px solid #e0e7ff;border-radius:16px;margin-top:10px;
}
.qresult .rem{font-size:3.5em;margin-bottom:8px}
.qresult .big{font-size:3em;font-weight:900;color:#7c3aed;margin-bottom:4px}
.qresult .rmsg{color:#1e1b4b;font-size:1em;margin-bottom:6px;font-weight:800}
.qresult .pts{
  color:#10b981;font-size:.9em;font-weight:800;
  margin-bottom:6px;
}
.qresult .acc{
  color:#6b7280;font-size:.82em;font-weight:600;
  margin-bottom:18px;
}
.result-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rbtn{
  padding:11px 20px;border:none;border-radius:12px;
  font-size:.88em;font-weight:800;cursor:pointer;
  font-family:inherit;
}
.rbtn.primary{
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3);
}
.rbtn.secondary{
  background:#f8f7ff;border:1.5px solid #e0e7ff;color:#7c3aed;
}

/* No data */
.nodata-q{
  text-align:center;padding:40px 20px;
  background:#fff7ed;border:1.5px solid #fed7aa;
  border-radius:14px;
}
.nodata-q h4{color:#c2410c;margin-bottom:8px}
.nodata-q p{color:#6b7280;font-size:.84em;line-height:1.6;margin-bottom:14px}
.nodata-q button{
  padding:11px 22px;
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  border:none;border-radius:10px;color:#fff;
  font-size:.88em;cursor:pointer;font-weight:700;font-family:inherit;
}

/* Nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#ffffff;border-top:1.5px solid #e0e7ff;
  display:flex;padding:8px 0 12px;
  box-shadow:0 -2px 12px rgba(124,58,237,.08);
}
.nb{
  flex:1;background:none;border:none;color:#c4b5fd;
  font-size:.68em;padding:6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-weight:700;font-family:inherit;
}
.nb .ic{font-size:1.35em}
.nb.active{color:#7c3aed}
</style>
</head>

const user=JSON.parse(localStorage.getItem('raaz4_user')||'null');
if(!user)location.href='index.html';

document.getElementById('sc').textContent=user.score||0;
document.getElementById('lv').textContent=user.level||1;
document.getElementById('td').textContent=(user.completedTopics||[]).length;
document.getElementById('langSel').value=localStorage.getItem('raaz4_lang')||'en';

function getLang(){return document.getElementById('langSel').value;}
function onLangChange(){localStorage.setItem('raaz4_lang',getLang());}

// ── Categories ──
const CATS=['All',...new Set(TOPICS.map(t=>t.cat))];
let selCat='All';
const filtersEl=document.getElementById('filters');
CATS.forEach(c=>{
  const btn=document.createElement('button');
  btn.className='fbtn'+(c==='All'?' active':'');
  btn.textContent=c==='All'?'🌟 All':c;
  btn.onclick=()=>{
    selCat=c;
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  };
  filtersEl.appendChild(btn);
});

// ── Quiz State ──
let qAnswers={},qScore=0,curQuiz=[],curTopic=null;

// ── Render Topic List ──
function renderList(){
  const done=user.completedTopics||[];
  const filtered=TOPICS.filter(t=>selCat==='All'||t.cat===selCat);
  const tlist=document.getElementById('tlist');
  tlist.innerHTML='';
  filtered.forEach(t=>{
    const isDone=done.includes(t.name);
    const data=window.RAAZ4_DATA&&window.RAAZ4_DATA[t.name];
    const hasData=data&&data!==null;
    const lang=getLang();
    const quiz=hasData&&data.quiz?(data.quiz[lang]||data.quiz['en']||[]):[];
    const hasQuiz=quiz&&quiz.length>0;

    const div=document.createElement('div');
    div.className='titem'+(isDone?' done':'')+((!hasQuiz)?' nodata':'');
    div.style.setProperty('--c',t.c);
    div.innerHTML=`
      <span class="em">${t.em}</span>
      <div class="info">
        <div class="tn">${t.name}</div>
        <div class="cat">
          ${t.cat} • #${t.n}
          ${hasQuiz?'• '+quiz.length+' Questions':''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <span class="arr">${isDone?'✓':'›'}</span>
        <span class="badge ${isDone?'done-b':hasQuiz?'play-b':'soon-b'}">
          ${isDone?'Done':hasQuiz?'Play':'Soon'}
        </span>
      </div>`;

    if(hasQuiz){
      div.onclick=()=>startQuiz(t,quiz);
    }
    tlist.appendChild(div);
  });
}

// ── Start Quiz ──
function startQuiz(topic,quiz){
  curTopic=topic;
  curQuiz=quiz;
  qAnswers={};qScore=0;

  // Switch to quiz page
  document.getElementById('listPage').style.display='none';
  document.getElementById('quizPage').style.display='block';
  document.getElementById('backBtn').style.display='flex';
  document.getElementById('hdrTitle').textContent=topic.em+' '+topic.name+' Quiz';

  renderQuiz();
}

// ── Render Quiz ──
function renderQuiz(){
  const total=curQuiz.length;
  const answered=Object.keys(qAnswers).length;
  const pct=total?Math.round((answered/total)*100):0;

  let html=`
  <div class="topic-hdr">
    <span class="em">${curTopic.em}</span>
    <div>
      <div class="title">${curTopic.name}</div>
      <div class="sub">${curTopic.cat} • ${total} Questions</div>
    </div>
  </div>

  <div class="quiz-info">
    <div class="qi-card">
      <div class="v">${total}</div>
      <div class="l">❓ Questions</div>
    </div>
    <div class="qi-card">
      <div class="v">${answered}</div>
      <div class="l">✅ Answered</div>
    </div>
    <div class="qi-card">
      <div class="v">${qScore}</div>
      <div class="l">⭐ Correct</div>
    </div>
  </div>

  <div class="prog-bar">
    <div class="prog-fill" style="width:${pct}%"></div>
  </div>`;

  curQuiz.forEach((q,i)=>{
    const ans=qAnswers[i];
    html+=`
    <div class="qcard" id="qc${i}">
      <div class="qnum">
        Question ${i+1} of ${total}
        <span class="qbadge">${ans!==undefined?(ans.chosen===ans.correct?'✓ Correct':'✗ Wrong'):'Not answered'}</span>
      </div>
      <div class="qtxt">${q.q}</div>
      <div class="qopts">
        ${q.o.map((o,j)=>`
        <button class="opt" id="o_${i}_${j}"
          onclick="pick(${i},${j},${q.a})"
          ${ans!==undefined?'disabled':''}>
          ${o}
        </button>`).join('')}
      </div>
      <div class="qexp" id="exp_${i}"
        style="${ans!==undefined?'display:block':''}">
        💡 ${q.exp}
      </div>
    </div>`;
  });

  // Result
  html+=`
  <div class="qresult" id="qres">
    <div class="rem" id="qrem">🎉</div>
    <div class="big" id="qfin">0/0</div>
    <div class="rmsg" id="qrmsg"></div>
    <div class="pts" id="qpts"></div>
    <div class="acc" id="qacc"></div>
    <div class="result-btns">
      <button class="rbtn primary" onclick="retryQ()">↺ Try Again</button>
      <button class="rbtn secondary" onclick="goBack()">← Topics</button>
    </div>
  </div>`;

  document.getElementById('quizContent').innerHTML=html;

  // Restore answered state
  Object.keys(qAnswers).forEach(qi=>{
    const {chosen,correct}=qAnswers[qi];
    const ce=document.getElementById(`o_${qi}_${chosen}`);
    if(ce)ce.classList.add(chosen==correct?'ok':'no');
    const coe=document.getElementById(`o_${qi}_${correct}`);
    if(coe&&chosen!=correct)coe.classList.add('ok');
  });

  // Show result if all answered
  if(Object.keys(qAnswers).length===total&&total>0){
    showResult(total);
  }
}

// ── Pick Answer ──
function pick(qi,chosen,correct){
  if(qAnswers[qi]!==undefined)return;
  qAnswers[qi]={chosen,correct};
  if(chosen===correct)qScore++;

  document.querySelectorAll(`[id^="o_${qi}_"]`)
    .forEach(b=>b.disabled=true);
  const ce=document.getElementById(`o_${qi}_${chosen}`);
  if(ce)ce.classList.add(chosen===correct?'ok':'no');
  const coe=document.getElementById(`o_${qi}_${correct}`);
  if(coe&&chosen!==correct)coe.classList.add('ok');
  const exp=document.getElementById(`exp_${qi}`);
  if(exp)exp.style.display='block';

  // Update progress
  const total=curQuiz.length;
  const answered=Object.keys(qAnswers).length;
  const pct=Math.round((answered/total)*100);
  const fill=document.querySelector('.prog-fill');
  if(fill)fill.style.width=pct+'%';

  // Update qbadge
  const badge=document.querySelector(`#qc${qi} .qbadge`);
  if(badge)badge.textContent=chosen===correct?'✓ Correct':'✗ Wrong';

  // Update counter
  const qiCards=document.querySelectorAll('.qi-card .v');
  if(qiCards[1])qiCards[1].textContent=answered;
  if(qiCards[2])qiCards[2].textContent=qScore;

  if(answered===total)showResult(total);
}

// ── Show Result ──
function showResult(total){
  const pct=total?Math.round((qScore/total)*100):0;
  let rem,msg;
  if(pct>=80){rem='🏆';msg='Excellent! Shabaash!';}
  else if(pct>=60){rem='🎯';msg='Bahut Achha!';}
  else if(pct>=40){rem='💪';msg='Keep Going!';}
  else{rem='📚';msg='Phir se padhein!';}

  const el=document.getElementById('qres');
  if(!el)return;
  el.style.display='block';
  el.scrollIntoView({behavior:'smooth'});

  document.getElementById('qrem').textContent=rem;
  document.getElementById('qfin').textContent=`${qScore}/${total}`;
  document.getElementById('qrmsg').textContent=msg;

  const pts=qScore*20;
  document.getElementById('qpts').textContent=
    pts>0?`+${pts} points earned!`:'Keep trying!';
  document.getElementById('qacc').textContent=
    `Accuracy: ${pct}% | ${qScore} correct out of ${total}`;

  // Save score
  if(pts>0){
    const users=JSON.parse(localStorage.getItem('raaz4_users')||'[]');
    const i=users.findIndex(u=>u.username===user.username);
    if(i!==-1){
      users[i].score=(users[i].score||0)+pts;
      users[i].level=Math.floor(users[i].score/100)+1;
      if(!users[i].completedTopics.includes(curTopic.name))
        users[i].completedTopics.push(curTopic.name);
      localStorage.setItem('raaz4_users',JSON.stringify(users));
      localStorage.setItem('raaz4_user',JSON.stringify(users[i]));
      user.score=users[i].score;
      user.level=users[i].level;
      user.completedTopics=users[i].completedTopics;
      document.getElementById('sc').textContent=user.score;
      document.getElementById('lv').textContent=user.level;
      document.getElementById('td').textContent=user.completedTopics.length;
    }
  }
}

// ── Retry ──
function retryQ(){
  qAnswers={};qScore=0;
  renderQuiz();
}

// ── Go Back ──
function goBack(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('listPage').style.display='block';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('hdrTitle').textContent='🎮 RAAZ4 — Quiz';
  renderList();
}

function showBoard(){
  const users=JSON.parse(localStorage.getItem('raaz4_users')||'[]');
  const top=users.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,10);
  if(!top.length)return alert('Abhi koi score nahi!');
  alert('🏆 LEADERBOARD\n\n'+
    top.map((u,i)=>`${i+1}. ${u.name} — ${u.score||0}pts (Lv.${u.level||1})`).join('\n'));
}

// Init
renderList();
</script>
