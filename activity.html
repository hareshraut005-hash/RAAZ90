<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>RAAZ4 - Learn</title>
<script src="data/topics.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#ffffff;min-height:100vh;color:#1e1b4b;padding-bottom:90px}
.hdr{background:#ffffff;border-bottom:1.5px solid #e0e7ff;padding:12px 15px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(124,58,237,.08)}
.bk{background:#f3f0ff;border:none;color:#7c3aed;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1em;font-weight:800;flex-shrink:0}
.hdr-t{font-size:1em;font-weight:800;color:#7c3aed;flex:1}
.lang-row{padding:10px 14px;background:#f8f7ff;border-bottom:1.5px solid #e0e7ff;display:flex;gap:8px;align-items:center}
.lang-row label{color:#6b7280;font-size:.78em;font-weight:700;white-space:nowrap}
.lsel{flex:1;padding:8px 10px;background:#ffffff;border:1.5px solid #e0e7ff;border-radius:10px;color:#1e1b4b;font-size:.83em;outline:none;font-weight:600;font-family:inherit}
.load-wrap{padding:80px 20px;text-align:center}
.spinner{width:48px;height:48px;border:3px solid #e0e7ff;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{color:#6b7280;font-size:.9em;font-weight:600}
.t-hdr{margin:14px;border-radius:16px;padding:18px 16px;background:linear-gradient(135deg,#f3f0ff,#ede9fe);border:1.5px solid #e0e7ff;box-shadow:0 4px 15px rgba(124,58,237,.08)}
.t-inner{display:flex;align-items:center;gap:14px}
.t-em{font-size:3em}
.t-title{font-size:1.25em;font-weight:900;color:#1e1b4b;margin-bottom:4px}
.t-sub{font-size:.82em;color:#7c3aed;font-weight:600}
.vpanel{margin:0 14px 12px;background:#f8f7ff;border:1.5px solid #e0e7ff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(124,58,237,.05)}
.vpanel-hdr{font-size:.8em;font-weight:800;color:#7c3aed;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.voice-tip{font-size:.73em;color:#6b7280;margin-bottom:10px;background:#ffffff;padding:8px 12px;border-radius:10px;border:1.5px solid #e0e7ff;line-height:1.6}
.vbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.vb{padding:12px 4px;border:none;border-radius:12px;font-size:.78em;cursor:pointer;font-weight:800;color:#fff;transition:all .2s;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.vb:active{transform:scale(.92)}
.vb span{font-size:1.3em}
.vb.play{background:linear-gradient(135deg,#10b981,#34d399)}
.vb.pau{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.vb.stp{background:linear-gradient(135deg,#ef4444,#f87171)}
.vb.rep{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.spd-row{display:flex;align-items:center;gap:10px;background:#ffffff;padding:9px 12px;border-radius:10px;border:1.5px solid #e0e7ff}
.spd-row label{color:#6b7280;font-size:.75em;font-weight:700;white-space:nowrap}
.spd-row input{flex:1;accent-color:#7c3aed}
.spd-row span{color:#7c3aed;font-size:.82em;font-weight:800;min-width:32px;text-align:right}
.vstatus{margin-top:8px;padding:7px 12px;background:#ffffff;border-radius:10px;border:1.5px solid #e0e7ff;font-size:.73em;color:#6b7280;font-weight:600;text-align:center}
.fulltext-card{margin:0 14px 12px;background:#ffffff;border:1.5px solid #e0e7ff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(124,58,237,.05)}
.fulltext-hdr{padding:12px 16px;background:#f8f7ff;border-bottom:1.5px solid #e0e7ff;font-size:.85em;font-weight:800;color:#7c3aed;display:flex;align-items:center;justify-content:space-between}
.touch-hint{font-size:.7em;color:#a5b4fc;font-weight:600;background:#ede9fe;padding:3px 8px;border-radius:10px}
.fulltext-body{padding:16px}
.fulltext-body p{color:#374151;font-size:.9em;line-height:1.9;text-align:justify;margin-bottom:12px}
.fulltext-body p:last-child{margin-bottom:0}
.cw{cursor:pointer;border-radius:4px;padding:1px 3px;transition:all .15s;display:inline;line-height:1.9;border-bottom:1px dotted #c4b5fd}
.cw:hover{background:#ede9fe;color:#7c3aed;border-bottom:1px solid #7c3aed}
.cw.active{background:#7c3aed;color:#ffffff;border-radius:4px;border-bottom:none;box-shadow:0 2px 6px rgba(124,58,237,.4)}
.icard{margin:0 14px 12px;border-radius:14px;padding:14px 16px;border:1.5px solid}
.icard.fact{background:#faf5ff;border-color:#e9d5ff}
.icard.real{background:#eff6ff;border-color:#bfdbfe}
.icard.tip{background:#f0fdf4;border-color:#a7f3d0}
.icard h4{font-size:.8em;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.icard.fact h4{color:#7c3aed}
.icard.real h4{color:#1d4ed8}
.icard.tip h4{color:#065f46}
.icard p{font-size:.84em;color:#374151;line-height:1.7}
.quiz-btn{margin:0 14px 14px;display:block;width:calc(100% - 28px);padding:14px;background:linear-gradient(135deg,#7c3aed,#6366f1);border:none;border-radius:14px;color:#fff;font-size:.95em;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 15px rgba(124,58,237,.3);text-align:center}
.quiz-btn:active{transform:scale(.97)}
.nodata{margin:20px 14px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:14px;padding:28px 20px;text-align:center}
.nodata h4{color:#c2410c;margin-bottom:8px;font-size:1em}
.nodata p{color:#6b7280;font-size:.84em;line-height:1.6;margin-bottom:14px}
.nodata button{padding:11px 22px;background:linear-gradient(135deg,#7c3aed,#6366f1);border:none;border-radius:10px;color:#fff;font-size:.88em;cursor:pointer;font-weight:700;font-family:inherit}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:1.5px solid #e0e7ff;display:flex;padding:8px 0 12px;box-shadow:0 -2px 12px rgba(124,58,237,.08)}
.nb{flex:1;background:none;border:none;color:#c4b5fd;font-size:.68em;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-family:inherit}
.nb .ic{font-size:1.35em}
.nb.active{color:#7c3aed}
</style>
</head>
<body>
<div class="hdr">
  <button class="bk" onclick="history.back()">←</button>
  <div class="hdr-t">🧠 RAAZ4 — Learn</div>
</div>
<div class="lang-row">
  <label>🌍 Language:</label>
  <select class="lsel" id="langSel" onchange="onLangChange()">
    <option value="en">🇺🇸 English</option>
    <option value="hi">🇮🇳 हिंदी</option>
  </select>
</div>
<div id="main"></div>
<div class="bnav">
  <button class="nb" onclick="location.href='home.html'"><span class="ic">🏠</span>Home</button>
  <button class="nb active"><span class="ic">📖</span>Learn</button>
  <button class="nb" onclick="location.href='quiz.html'"><span class="ic">🎮</span>Quiz</button>
  <button class="nb" onclick="showBoard()"><span class="ic">🏆</span>Rank</button>
</div>
<script>
const user=JSON.parse(localStorage.getItem('raaz4_user')||'null');
if(!user)location.href='index.html';

const sy=window.speechSynthesis;
let voices=[],spRate=0.9;
let curVoiceText='',curData=null,curTopic='',curLD=null;
let speakQueue=[],isSpeaking=false;
let allCWNodes=[],currentWordIdx=0;

function initVoices(){voices=sy.getVoices();}
initVoices();
if(sy.onvoiceschanged!==undefined)sy.onvoiceschanged=initVoices;

document.getElementById('langSel').value=localStorage.getItem('raaz4_lang')||'en';
function getLang(){return document.getElementById('langSel').value;}
function onLangChange(){
  localStorage.setItem('raaz4_lang',getLang());
  sy.cancel();speakQueue=[];isSpeaking=false;
  if(curData)loadContent(curData,curTopic);
}

function cleanText(text){
  return text.replace(/\n\n+/g,' ').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
}

function splitSentences(text){
  const parts=text.split(/(?<=[।.!?])\s+/);
  return parts.filter(p=>p.trim().length>0);
}

function getMaleVoice(vl){
  return voices.find(v=>v.lang===vl&&
    (v.name.toLowerCase().includes('male')||
     v.name.toLowerCase().includes('david')||
     v.name.toLowerCase().includes('james')||
     !v.name.toLowerCase().includes('female')))||
    voices.find(v=>v.lang.startsWith(vl.split('-')[0])&&
      !v.name.toLowerCase().includes('female'))||
    voices.find(v=>v.lang===vl)||
    voices[0];
}

function runQueue(){
  if(speakQueue.length===0){
    isSpeaking=false;
    allCWNodes.forEach(w=>w.classList.remove('active'));
    updateStatus('✅ Done!');
    return;
  }
  isSpeaking=true;
  const chunk=speakQueue.shift();
  const vl=curLD?.voiceLang||'en-US';
  const u=new SpeechSynthesisUtterance(chunk);
  u.lang=vl;u.rate=spRate;u.pitch=1;u.volume=1;
  const match=getMaleVoice(vl);
  if(match)u.voice=match;
  u.onboundary=e=>{
    if(e.name==='word'){
      allCWNodes.forEach(w=>w.classList.remove('active'));
      if(allCWNodes[currentWordIdx]){
        allCWNodes[currentWordIdx].classList.add('active');
        allCWNodes[currentWordIdx].scrollIntoView({behavior:'smooth',block:'center'});
      }
      currentWordIdx++;
    }
  };
  u.onend=()=>setTimeout(runQueue,100);
  u.onerror=e=>{if(e.error!=='interrupted')setTimeout(runQueue,100);};
  sy.speak(u);
}

function makeClickable(text){
  if(!text)return '';
  return text.split('\n\n').map(para=>{
    if(!para.trim())return '';
    return '<p>'+para.trim().split(' ').map(word=>
      `<span class="cw" onclick="speakFrom(this)">${word}</span>`
    ).join(' ')+'</p>';
  }).join('');
}

function speak(){
  if(!curVoiceText){updateStatus('⚠️ Text nahi hai');return;}
  sy.cancel();speakQueue=[];isSpeaking=false;
  allCWNodes=Array.from(document.querySelectorAll('.cw'));
  currentWordIdx=0;
  allCWNodes.forEach(w=>w.classList.remove('active'));
  speakQueue=splitSentences(cleanText(curVoiceText));
  updateStatus('▶️ Playing...');
  runQueue();
}

function speakFrom(el){
  sy.cancel();speakQueue=[];isSpeaking=false;
  allCWNodes=Array.from(document.querySelectorAll('.cw'));
  allCWNodes.forEach(w=>w.classList.remove('active'));
  const startIdx=allCWNodes.indexOf(el);
  currentWordIdx=startIdx>=0?startIdx:0;
  const txt=allCWNodes.slice(currentWordIdx).map(w=>w.textContent).join(' ');
  speakQueue=splitSentences(cleanText(txt));
  el.classList.add('active');
  updateStatus('▶️ Selected word se play...');
  runQueue();
}

function pauseV(){
  if(sy.paused){sy.resume();updateStatus('▶️ Playing...');}
  else{sy.pause();updateStatus('⏸️ Paused');}
}
function stopV(){
  sy.cancel();speakQueue=[];isSpeaking=false;
  allCWNodes.forEach(w=>w.classList.remove('active'));
  updateStatus('⏹️ Stopped');
}
function replayV(){stopV();setTimeout(speak,200);}
function updateStatus(txt){
  const el=document.getElementById('vstatus');
  if(el)el.textContent=txt;
}

function renderContent(ld){
  curLD=ld;
  curVoiceText=ld.voiceText||ld.fullText||'';
  let html='';

  html+=`
  <div class="t-hdr">
    <div class="t-inner">
      <span class="t-em">${curData.emoji||'🧠'}</span>
      <div>
        <div class="t-title">${curTopic}</div>
        <div class="t-sub">${ld.subtitle||''}</div>
      </div>
    </div>
  </div>`;

  html+=`
  <div class="vpanel">
    <div class="vpanel-hdr">🔊 Voice Controls</div>
    <div class="voice-tip">
      💡 Play dabao → poora sunai dega<br>
      👆 Koi bhi word touch karo → wahan se sunai dega
    </div>
    <div class="vbtns">
      <button class="vb play" onclick="speak()"><span>▶️</span>Play</button>
      <button class="vb pau" onclick="pauseV()"><span>⏸️</span>Pause</button>
      <button class="vb stp" onclick="stopV()"><span>⏹️</span>Stop</button>
      <button class="vb rep" onclick="replayV()"><span>↺</span>Replay</button>
    </div>
    <div class="spd-row">
      <label>Speed:</label>
      <input type="range" min=".5" max="2" step=".1" value="${spRate}"
        oninput="spRate=parseFloat(this.value);
        document.getElementById('spv').textContent=this.value+'x'">
      <span id="spv">${spRate}x</span>
    </div>
    <div class="vstatus" id="vstatus">
      👆 Word touch karo ya ▶️ Play dabao
    </div>
  </div>`;

  if(ld.fullText){
    html+=`
    <div class="fulltext-card">
      <div class="fulltext-hdr">
        📖 Complete Guide
        <span class="touch-hint">👆 Touch → wahan se bolega</span>
      </div>
      <div class="fulltext-body">
        ${makeClickable(ld.fullText)}
      </div>
    </div>`;
  }

  if(ld.keyFact)html+=`
  <div class="icard fact">
    <h4>💡 Key Fact</h4>
    <p>${ld.keyFact}</p>
  </div>`;

  if(ld.realLife)html+=`
  <div class="icard real">
    <h4>🌍 Real Life Example</h4>
    <p>${ld.realLife}</p>
  </div>`;

  if(ld.protectTip)html+=`
  <div class="icard tip">
    <h4>🛡️ Protection Tip</h4>
    <p>${ld.protectTip}</p>
  </div>`;

  html+=`
  <button class="quiz-btn"
    onclick="localStorage.setItem('raaz4_topic','${curTopic.replace(/'/g,"\\'")}');location.href='quiz.html'">
    🎮 Quiz Khelo — ${curTopic}
  </button>`;

  document.getElementById('main').innerHTML=html;
}

function loadContent(data,topic){
  curData=data;curTopic=topic;
  speakQueue=[];isSpeaking=false;
  const lang=getLang();
  const ld=(data.content&&data.content[lang])||(data.content&&data.content['en'])||null;
  if(!ld){
    document.getElementById('main').innerHTML=`
    <div class="nodata">
      <h4>⏳ Data Coming Soon!</h4>
      <p>"${topic}" ka content jald hi aayega.</p>
      <button onclick="location.href='home.html'">🏠 Home</button>
    </div>`;
    return;
  }
  renderContent(ld);
}

function showBoard(){
  const users=JSON.parse(localStorage.getItem('raaz4_users')||'[]');
  const top=users.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,10);
  if(!top.length)return alert('Abhi koi score nahi!');
  alert('🏆 LEADERBOARD\n\n'+top.map((u,i)=>`${i+1}. ${u.name} — ${u.score||0}pts (Lv.${u.level||1})`).join('\n'));
}

document.getElementById('main').innerHTML=`
<div class="load-wrap">
  <div class="spinner"></div>
  <div class="load-txt">Loading...</div>
</div>`;

setTimeout(()=>{
  const topic=localStorage.getItem('raaz4_topic')||'Dark Psychology';
  const data=window.RAAZ4_DATA&&window.RAAZ4_DATA[topic];
  if(data)loadContent(data,topic);
  else{
    document.getElementById('main').innerHTML=`
    <div class="nodata">
      <h4>⏳ Data Coming Soon!</h4>
      <p>"${topic}" ka content jald hi aayega.</p>
      <button onclick="location.href='home.html'">🏠 Home</button>
    </div>`;
  }
},300);
</script>
</body>
</html>
