<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>RAAZ4 - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#ffffff;min-height:100vh;color:#1e1b4b;padding-bottom:90px}

/* Header */
.hdr{
  background:#ffffff;
  border-bottom:1.5px solid #e0e7ff;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(124,58,237,.08);
}
.logo{
  font-size:1.5em;font-weight:900;
  color:#7c3aed;letter-spacing:2px;
}
.ubox{display:flex;align-items:center;gap:8px}
.uinfo{text-align:right}
.uname{font-size:.82em;color:#1e1b4b;font-weight:700}
.uscore{font-size:.72em;color:#7c3aed;font-weight:600}
.logbtn{
  background:none;
  border:1.5px solid #fca5a5;
  color:#ef4444;
  padding:5px 10px;
  border-radius:8px;
  font-size:.75em;
  cursor:pointer;
  font-weight:700;
}

/* Language */
.lang-bar{
  padding:10px 14px;
  background:#f8f7ff;
  border-bottom:1.5px solid #e0e7ff;
}
.lsel{
  width:100%;
  padding:9px 12px;
  background:#ffffff;
  border:1.5px solid #e0e7ff;
  border-radius:10px;
  color:#1e1b4b;
  font-size:.85em;
  outline:none;
  font-weight:600;
  font-family:inherit;
}

/* Stats */
.stats{
  display:flex;gap:8px;
  padding:12px 14px;
}
.scard{
  flex:1;
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
}
.scard .v{
  font-size:1.4em;font-weight:900;
  color:#7c3aed;
}
.scard .l{
  color:#6b7280;font-size:.65em;
  margin-top:2px;font-weight:600;
}

/* Search */
.srch-box{padding:0 14px 10px}
.srch{
  width:100%;
  padding:11px 16px;
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:12px;
  color:#1e1b4b;
  font-size:.88em;
  outline:none;
  font-family:inherit;
  transition:border .2s;
}
.srch:focus{border-color:#7c3aed}
.srch::placeholder{color:#c4b5fd}

/* Categories */
.cats{
  display:flex;gap:6px;
  overflow-x:auto;
  padding:0 14px 12px;
  scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat-btn{
  white-space:nowrap;
  padding:7px 14px;
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:20px;
  color:#6b7280;
  font-size:.75em;
  cursor:pointer;
  font-weight:700;
  flex-shrink:0;
  transition:all .2s;
  font-family:inherit;
}
.cat-btn.active{
  background:#7c3aed;
  border-color:#7c3aed;
  color:#fff;
  box-shadow:0 2px 8px rgba(124,58,237,.3);
}

/* Section Header */
.sec-hdr{
  padding:10px 14px 6px;
  display:flex;align-items:center;gap:8px;
}
.sec-hdr span{
  font-size:.78em;font-weight:800;
  color:#7c3aed;text-transform:uppercase;
  letter-spacing:.5px;
}
.sec-hdr .line{
  flex:1;height:1.5px;
  background:#e0e7ff;
}

/* Topic Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;padding:0 14px 8px;
}
.tc{
  background:#f8f7ff;
  border:1.5px solid #e0e7ff;
  border-radius:14px;
  padding:14px 10px;
  cursor:pointer;
  transition:all .2s;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(124,58,237,.05);
}
.tc:active{transform:scale(.95)}
.tc::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:3px;
  background:var(--c,#7c3aed);
}
.tc .num{
  position:absolute;top:7px;right:8px;
  font-size:.6em;color:#c4b5fd;font-weight:800;
}
.tc .em{
  font-size:1.9em;
  margin-bottom:6px;
  display:block;
}
.tc .tn{
  font-size:.76em;font-weight:700;
  color:#1e1b4b;line-height:1.3;
}
.tc.done{
  border-color:#a7f3d0;
  background:#f0fdf4;
}
.tc.done::after{
  content:'✓';
  position:absolute;top:6px;left:7px;
  font-size:.6em;
  background:#d1fae5;color:#065f46;
  padding:2px 5px;border-radius:8px;
  font-weight:800;
}
.tc.locked{opacity:.5}

/* Empty */
.empty{
  text-align:center;
  padding:50px 20px;
  color:#c4b5fd;
  font-size:.9em;
}

/* Bottom Nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  background:#ffffff;
  border-top:1.5px solid #e0e7ff;
  display:flex;padding:8px 0 12px;
  box-shadow:0 -2px 12px rgba(124,58,237,.08);
}
.nb{
  flex:1;background:none;border:none;
  color:#c4b5fd;font-size:.68em;
  padding:6px;cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:2px;
  font-weight:700;font-family:inherit;
  transition:color .2s;
}
.nb .ic{font-size:1.35em}
.nb.active{color:#7c3aed}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">🧠 RAAZ4</div>
  <div class="ubox">
    <div class="uinfo">
      <div class="uname" id="uname">User</div>
      <div class="uscore" id="uscore">⭐ 0 pts</div>
    </div>
    <button class="logbtn" onclick="logout()">Exit</button>
  </div>
</div>

<div class="lang-bar">
  <select class="lsel" id="langSel" onchange="saveLang()">
    <option value="en">🇺🇸 English</option>
    <option value="hi">🇮🇳 हिंदी (Hindi)</option>
  </select>
</div>

<div class="stats">
  <div class="scard">
    <div class="v" id="sc">0</div>
    <div class="l">⭐ Score</div>
  </div>
  <div class="scard">
    <div class="v" id="lv">1</div>
    <div class="l">🎯 Level</div>
  </div>
  <div class="scard">
    <div class="v" id="td">0</div>
    <div class="l">✅ Done</div>
  </div>
  <div class="scard">
    <div class="v">90</div>
    <div class="l">📚 Total</div>
  </div>
</div>

<div class="srch-box">
  <input class="srch" id="srch"
    placeholder="🔍 Topic search karo..."
    oninput="render()">
</div>

<div class="cats" id="cats"></div>
<div id="content"></div>

<div class="bnav">
  <button class="nb active">
    <span class="ic">🏠</span>Home
  </button>
  <button class="nb" onclick="location.href='activity.html'">
    <span class="ic">📖</span>Learn
  </button>
  <button class="nb" onclick="location.href='quiz.html'">
    <span class="ic">🎮</span>Quiz

  <button class="nb" onclick="showBoard()">
    <span class="ic">🏆</span>Rank

</div>

  {n:86,name:'Existential Psychology',em:'🌌',cat:'Classic Psych',c:'#1d4ed8'},
  {n:87,name:'Serial Killer Psychology',em:'🔪',cat:'Classic Psych',c:'#1d4ed8'},

  {n:89,name:'Grey Rock Method',em:'🪨',cat:'Protection',c:'#6b7280'},

// User check
const user=JSON.parse(localStorage.getItem('raaz4_user')||'null');
if(!user)location.href='index.html';

// User info
document.getElementById('uname').textContent=user.name;
document.getElementById('uscore').textContent='⭐ '+(user.score||0)+' pts';
document.getElementById('sc').textContent=user.score||0;
document.getElementById('lv').textContent=user.level||1;
document.getElementById('td').textContent=(user.completedTopics||[]).length;
document.getElementById('langSel').value=localStorage.getItem('raaz4_lang')||'en';

function saveLang(){
  localStorage.setItem('raaz4_lang',
    document.getElementById('langSel').value);
}

// Categories
const CATS=['All',...new Set(TOPICS.map(t=>t.cat))];
let selCat='All';
const catsEl=document.getElementById('cats');
CATS.forEach(c=>{
  const btn=document.createElement('button');
  btn.className='cat-btn'+(c==='All'?' active':'');
  btn.textContent=c==='All'?'🌟 All':c;
  btn.onclick=()=>{
    selCat=c;
    document.querySelectorAll('.cat-btn')
      .forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  catsEl.appendChild(btn);
});

// Render topics
function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  const done=user.completedTopics||[];
  const filtered=TOPICS.filter(t=>{
    const mc=selCat==='All'||t.cat===selCat;
    const mq=!q||t.name.toLowerCase().includes(q)||
              t.cat.toLowerCase().includes(q);
    return mc&&mq;
  });
  const groups={};
  filtered.forEach(t=>{
    if(!groups[t.cat])groups[t.cat]=[];
    groups[t.cat].push(t);
  });
  let html='';
  Object.entries(groups).forEach(([cat,topics])=>{
    html+=`<div class="sec-hdr">
      <span>${cat}</span>
      <div class="line"></div>
    </div><div class="grid">`;
    topics.forEach(t=>{
      const d=done.includes(t.name);
      html+=`<div class="tc ${d?'done':''}"
        style="--c:${t.c}"
        onclick="go('${t.name.replace(/'/g,"\\'")}')">
        <span class="num">#${t.n}</span>
        <span class="em">${t.em}</span>
        <div class="tn">${t.name}</div>
      </div>`;
    });
    html+='</div>';
  });
  if(!filtered.length)
    html='<div class="empty">Koi topic nahi mila 🔍</div>';
  document.getElementById('content').innerHTML=html;
}
render();

function go(name){
  localStorage.setItem('raaz4_topic',name);
  location.href='activity.html';
}

function showBoard(){
  const users=JSON.parse(
    localStorage.getItem('raaz4_users')||'[]');
  const top=users
    .sort((a,b)=>(b.score||0)-(a.score||0))
    .slice(0,10);
  if(!top.length)return alert('Abhi koi score nahi!');
  alert('🏆 LEADERBOARD\n\n'+
    top.map((u,i)=>
      `${i+1}. ${u.name} — ${u.score||0}pts (Lv.${u.level||1})`
    ).join('\n'));
}

function logout(){
  localStorage.removeItem('raaz4_user');
  location.href='index.html';
}
</script>

</html>
